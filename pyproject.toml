[project]
name = "minisearch"
version = "0.1.0"
description = "Tiny semantic-ish search library used as a harness demo target"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests/unit", "tests/harness"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["demo"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
